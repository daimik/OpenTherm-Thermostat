[platformio]
default_envs = xiao_c6          ; simulated boiler. The real one: -e xiao_c6_real

; XIAO ESP32-C6 boiler node: BLE peripheral, OpenTherm master, optional read-only status page over Wi-Fi
; (the page is built in only when include/node_secrets.h exists)
[env:xiao_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino

monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0

; 1.9 MB for the firmware instead of 1.25 MB: Bluetooth plus Wi-Fi plus the status page need the room.
; The settings area (NVS) stays where it was, so the paired display is remembered across this change.
board_build.partitions = min_spiffs.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DBOILER_SIMULATED=1

lib_deps =
    h2zero/NimBLE-Arduino@2.5.2      ; exact version, same as the display
    ihormelnyk/OpenTherm Library@^1.1.5

; Same firmware with the OpenTherm backend instead of the simulation.
;   compile check only:  pio run -e xiao_c6_real
;   flash:               pio run -e xiao_c6_real -t upload --upload-port COMx
[env:xiao_c6_real]
extends = env:xiao_c6
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DBOILER_SIMULATED=0

; Commissioning aid: the same real-boiler firmware with the two OpenTherm pins exchanged in software.
; If the link comes up with this build, the two signal wires sit on each other's pins (correct is
; adapter IN to D1, adapter OUT to D2);
; either keep using this build or swap the two wires and go back to xiao_c6_real.
[env:xiao_c6_real_swapped]
extends = env:xiao_c6
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DBOILER_SIMULATED=0
    -DPIN_OT_RX=2
    -DPIN_OT_TX=1
