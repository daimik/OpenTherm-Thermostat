[platformio]
default_envs = ws35

; Waveshare ESP32-S3-Touch-LCD-3.5 (ESP32-S3R8, 16 MB flash, 8 MB OPI PSRAM)
[env:ws35]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.f_flash = 80000000L

; Set both to your own serial port, or delete the two lines to let PlatformIO find the board.
upload_port = COM6
monitor_port = COM6
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
upload_speed = 921600

; LVGL rendering is plain CPU work: optimise for speed, not size (16 MB flash, plenty of room)
build_unflags = -Os
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DCORE_DEBUG_LEVEL=1
    -DSENSOR_SDA_PIN=48         ; room sensor on its own I2C bus: SDA header pin 23
    -DSENSOR_SCL_PIN=47         ;                                 SCL header pin 21
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

lib_deps =
    lvgl/lvgl@8.4.0
    h2zero/NimBLE-Arduino@2.5.2      ; exact versions: a library update must be a decision, not a side effect of a rebuild
    knolleary/PubSubClient@2.8.0
; TCA9554, SensorLib and GFX Library for Arduino are vendored in lib/ at the
; exact versions Waveshare ships (0.1.2, 0.3.1, 1.5.5).
